name: Draw Keymap

on:
  workflow_dispatch:
  push:
    paths:
      - "config/cornix.keymap"
      - "boards/jzf/cornix/cornix-layouts.dtsi"
      - ".github/workflows/draw.yml"

jobs:
  draw:
    uses: caksoylar/keymap-drawer/.github/workflows/draw-zmk.yml@main
    permissions:
      contents: write
    with:
      keymap_patterns: "config/cornix.keymap"
      # cornix is a custom board, so point keymap-drawer at its ZMK physical layout
      draw_args: "cornix: '-d boards/jzf/cornix/cornix-layouts.dtsi -l layout_50'"
      commit_message: "[Draw] ${{ github.event.head_commit.message }}"
      destination: "commit"
      fail_on_error: ${{ fromJSON(true) }}
